; SHITFIRE Unreal port - engine config.
; RULE: every line in this file is a deliberate non-default (or a deliberate
; template-derived choice), each with a comment ABOVE it (UE ini parsing does
; not support inline comments). Everything else inherits BaseEngine.ini.

[/Script/EngineSettings.GameMapsSettings]
; P3 world map - near-empty .umap; everything spawns from C++ on BeginPlay
; (no-Blueprint-logic / near-empty-map rule, UNREAL_RESEARCH.md 8).
GameDefaultMap=/Game/Maps/P3World.P3World
EditorStartupMap=/Game/Maps/P3World.P3World
; C++ game mode; no Blueprint game mode exists or ever will.
GlobalDefaultGameMode=/Script/ShitfireGame.ShitfireGameMode

[/Script/Engine.RendererSettings]
; Fully dynamic day scene - no baked lighting, ever (same as 5.8 TP_Blank).
r.AllowStaticLighting=False
; Virtual shadow maps - the intended pairing with Lumen (5.8 TP_Blank default).
r.Shadow.Virtual.Enable=1
; Lumen GI ON to start - the 2026-09-02 FULL-MILSIM ruling says Lumen if the
; budget holds; the P3 perf snapshot measures it, keep/drop returns to the
; main thread. Values from EngineTypes.h:452 (0=None,1=Lumen,2=deprecated SSGI,3=Plugin).
r.DynamicGlobalIlluminationMethod=1
; Reflections: Screen Space (2), NOT Lumen (1) - reflections are a minor
; feature of a daylight land scene (ocean glint only) and Lumen reflections
; are the expensive half; keep them cheap (EngineTypes.h:472).
r.ReflectionMethod=2
; Mesh distance fields ON: software-Lumen's offscreen representation.
; KNOWN LIMIT (recorded honestly): runtime-generated RMC terrain has no
; distance field, so terrain GI relies on screen traces; static placeholder
; meshes (engine basic shapes) do get MDFs. Revisit with BUILDER-ASSETS.
r.GenerateMeshDistanceFields=True
; Anti-aliasing: TSR (4). Justification: 1080p on a 6 GB RTX 3060 Laptop -
; TSR gives us a working upscale lever (r.ScreenPercentage) if Lumen eats the
; frame budget, and handles sub-pixel placeholder geometry (masts, distant
; boxes) far better than FXAA. FXAA stays the documented cheap fallback.
; Values from SceneUtils.h: 0=None,1=FXAA,2=TAA,3=MSAA,4=TSR,5=SMAA.
r.AntiAliasingMethod=4
; No auto-exposure surprises: fixed exposure baseline; the C++-spawned
; PostProcessVolume clamps min/max EV as belt-and-suspenders.
r.DefaultFeature.AutoExposure=False
; Motion blur off - an observer holding binoculars on terrain, not a racer.
r.DefaultFeature.MotionBlur=False

; NOTE Nanite: no project-level toggle is set. Nothing in this project ships
; Nanite meshes (RMC terrain and engine basic shapes are non-Nanite), which
; is the plan-sanctioned "no Nanite" (fixed GPU overhead, hurts low-poly -
; UNREAL_RESEARCH.md 4). Volumetric fog is enabled per-actor on the
; C++-spawned ExponentialHeightFog (engine default r.VolumetricFog=1 stands).

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DX12 + SM6 - required for Lumen/VSM (copied from the 5.8 TP_Blank template).
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default

